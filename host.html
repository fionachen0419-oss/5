<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Host Console · Live Poll</title>
<style>
:root{--bg:#f6f7fb;--ink:#1c2233;--mut:#6b7385;--ok:#1f9d63;--err:#e11d48;--c0:#2f6fed;--c1:#f08a24;--c2:#8a93a6;--border:#dfe3ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}.topbar{background:#1c2233;color:#fff;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.topbar h1{font-size:18px;margin:0}.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:13px;font-weight:600}.pill.ok{background:rgba(31,157,99,.22);color:#4ade80}.pill.wait{background:rgba(245,158,11,.22);color:#fbbf24}.pill.err{background:rgba(225,29,72,.25);color:#fda4af}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}.wrap{max-width:1260px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:1fr 360px;gap:20px}@media(max-width:900px){.wrap{grid-template-columns:1fr}}.card{background:#fff;border-radius:16px;padding:22px;box-shadow:0 4px 16px rgba(28,34,51,.08);border:1px solid var(--border);margin-bottom:16px}.q-zh{font-size:28px;font-weight:700;margin:12px 0 4px;line-height:1.35}.status{display:inline-block;padding:4px 12px;border-radius:99px;background:#e6e9f3;color:var(--mut);font-size:14px;font-weight:700}.status.open{background:#dff5ea;color:var(--ok)}button{font-family:inherit;font-size:14px;padding:9px 13px;border-radius:10px;border:0;background:var(--ink);color:#fff;margin:3px 4px 3px 0;cursor:pointer;font-weight:600;line-height:1.3;text-align:left}button small{display:block;font-size:11px;font-weight:400;opacity:.85}button:disabled{opacity:.35;cursor:not-allowed}button.alt{background:#e6e9f3;color:var(--ink)}button.cur{outline:3px solid var(--c0);background:#eef3fe;color:var(--c0)}button.danger{background:#fee2e2;color:#b91c1c}button.top-btn{background:rgba(255,255,255,.14);color:#fff;padding:6px 12px;font-size:13px;margin:0}.row{display:flex;align-items:center;gap:12px;margin:14px 0}.lab{width:110px;font-size:22px;font-weight:800}.track{flex:1;background:#eceff6;border-radius:10px;height:52px;overflow:hidden}.fill{height:100%;transition:width .5s ease}.num{width:110px;text-align:right;font-size:22px;font-weight:700}.num small{display:block;font-size:13px;font-weight:400;color:var(--mut)}.sub{font-size:16px;font-weight:700;margin-bottom:8px}.tag{display:inline-block;background:#eef1fb;border-radius:99px;padding:5px 12px;margin:4px 6px 4px 0;font-size:14px}.txt{padding:10px 0;border-bottom:1px solid #eef0f6;font-size:17px}.txt b{display:inline-block;width:64px;color:var(--c0)}.mut{color:var(--mut);font-size:14px;line-height:1.5}input{width:100%;font-size:13px;padding:9px 10px;border:2px solid var(--border);border-radius:8px;margin-top:4px}#qr{width:230px;height:230px;margin:10px auto;display:flex;align-items:center;justify-content:center}.room-badge{background:#2f6fed;color:#fff;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:700;letter-spacing:1px}.ctl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
</style></head><body>
<div class="topbar"><h1>🎙️ Host Console</h1><div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px"><span id="conn-pill" class="pill wait"><span class="dot"></span><span id="conn-text">Connecting…</span></span><span style="font-size:13px;color:#cbd5e1">Room: <span class="room-badge" id="room-display"></span></span><button class="top-btn" onclick="manualSync()">↻ Refresh</button><button class="top-btn" style="background:#e11d48" onclick="hardRestart()">⟲ Reset All</button></div></div>
<div class="wrap"><div><div class="card" id="main">Initializing live connection…</div><div class="card" id="detail"></div></div><div><div class="card"><div class="sub">📱 Audience QR Entry</div><div id="qr"></div><p class="mut">Paste the public HTTPS URL of the audience page below. Do not use a local file:// URL.</p><input id="base-url" placeholder="https://fionachen0419-oss.github.io/5/" oninput="updateQR()"><p class="mut" id="full-link" style="word-break:break-all;font-size:11px"></p></div><div class="card" id="ctl"></div></div></div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script><script>
const CFG={options:[{id:"A",label:"Model A"},{id:"B",label:"Model B"},{id:"Tie",label:"Tie"}],reasons:["More comprehensive","More concise","Follows instructions better","Clearer formatting","More accurate info","More natural tone","About the same"],questions:[{id:"r1",short:"Round 1",text:"Round 1: Word Limit"},{id:"r2",short:"Round 2",text:"Round 2: Customer service empathy"},{id:"r3",short:"Round 3",text:"Round 3: Questions without clear rules"},{id:"ex1",short:"EX1",text:"EX1: Planning a One-Day Trip to Tainan"},{id:"ex2",short:"EX2",text:"EX2: Write a four-line poem"},{id:"pred",short:"Prediction",text:"Prediction: Which one will the LLM judge choose?"}]};
const cols=["var(--c0)","var(--c1)","var(--c2)"],esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const params=new URLSearchParams(location.search);let roomId=(params.get("room")||localStorage.getItem("host_room_id_v2")||"").trim().toUpperCase();if(!roomId)roomId="AI"+Math.random().toString(36).slice(2,6).toUpperCase();localStorage.setItem("host_room_id_v2",roomId);document.getElementById("room-display").textContent=roomId;
const STORE_KEY="host_arena_cache_"+roomId;let state={current:"r1",open:false,reveal:false,session:Date.now()},votesMap={r1:{},r2:{},r3:{},ex1:{},ex2:{},pred:{}};try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||"null");if(saved&&saved.state)state=saved.state;if(saved&&saved.votesMap)votesMap=Object.assign(votesMap,saved.votesMap)}catch(e){}function saveLocal(){localStorage.setItem(STORE_KEY,JSON.stringify({state,votesMap}))}
const TOPIC_STATE=`livevote2026/${roomId}/state`,TOPIC_VOTE=`livevote2026/${roomId}/vote`,TOPIC_PING=`livevote2026/${roomId}/ping`;const client=mqtt.connect("wss://broker.hivemq.com:8884/mqtt",{clientId:"host_"+roomId+"_"+Math.random().toString(36).slice(2,8),keepalive:20,reconnectPeriod:2000});function setConn(status,text){document.getElementById("conn-pill").className="pill "+status;document.getElementById("conn-text").textContent=text}
client.on("connect",()=>{setConn("ok","Live");client.subscribe([TOPIC_VOTE,TOPIC_PING],{qos:1});publishState()});client.on("reconnect",()=>setConn("wait","Reconnecting…"));client.on("offline",()=>setConn("err","Offline"));client.on("error",()=>setConn("err","Connection error"));client.on("message",(topic,payload)=>{try{const data=JSON.parse(payload.toString());if(topic===TOPIC_PING)publishState();else if(topic===TOPIC_VOTE&&data&&data.qid&&data.cid){if(data.session&&data.session!==state.session)return;votesMap[data.qid]=votesMap[data.qid]||{};votesMap[data.qid][data.cid]={choice:data.choice,reason:data.reason||"",text:data.text||"",ts:data.ts||Date.now()};saveLocal();render()}}catch(e){}});
function publishState(){saveLocal();if(client.connected)client.publish(TOPIC_STATE,JSON.stringify(state),{qos:1,retain:true})}setInterval(()=>{if(client.connected)client.publish(TOPIC_STATE,JSON.stringify(state),{qos:0,retain:true})},4000);window.addEventListener("storage",e=>{if(e.key===STORE_KEY&&e.newValue)try{const data=JSON.parse(e.newValue);if(data.votesMap)votesMap=data.votesMap;render()}catch(error){}});
function act(action,qid){if(action==="select"){state.current=qid;state.open=false;state.reveal=false}else if(action==="open"){state.open=true;state.reveal=false}else if(action==="close")state.open=false;else if(action==="reveal"){state.open=false;state.reveal=true}else if(action==="hide")state.reveal=false;else if(action==="reset"){votesMap[state.current]={};state.session=Date.now()}publishState();render()}
function manualSync(){publishState();render();const button=event.currentTarget,original=button.textContent;button.textContent="✓ Synced";setTimeout(()=>button.textContent=original,1000)}function hardRestart(){if(!confirm("Reset all rounds and start fresh?"))return;votesMap={r1:{},r2:{},r3:{},ex1:{},ex2:{},pred:{}};state={current:"r1",open:false,reveal:false,session:Date.now()};publishState();render()}
function updateQR(){const base=document.getElementById("base-url").value.trim(),qrBox=document.getElementById("qr"),link=document.getElementById("full-link");localStorage.setItem("voter_base_url_v2",base);if(!base){qrBox.textContent="Paste a public URL to generate the QR code";link.textContent="";return}if(base.startsWith("file://")){qrBox.textContent="file:// URLs do not work on phones. Upload the site to GitHub Pages first.";link.textContent="";return}const url=base+(base.includes("?")?"&":"?")+"room="+encodeURIComponent(roomId),qr=qrcode(0,"M");qr.addData(url);qr.make();qrBox.innerHTML=qr.createSvgTag({cellSize:5,margin:2,scalable:true});link.textContent="Audience URL: "+url}document.getElementById("base-url").value=localStorage.getItem("voter_base_url_v2")||"https://fionachen0419-oss.github.io/5/";updateQR();
function render(){const question=CFG.questions.find(item=>item.id===state.current)||CFG.questions[0],votes=votesMap[state.current]||{},counts={},reasons={},comments=[];CFG.options.forEach(option=>{counts[option.id]=0;reasons[option.id]={}});let total=0;for(const id in votes){const vote=votes[id];if(!vote||!vote.choice)continue;total++;counts[vote.choice]=(counts[vote.choice]||0)+1;if(vote.reason)reasons[vote.choice][vote.reason]=(reasons[vote.choice][vote.reason]||0)+1;if(vote.text)comments.push({choice:vote.choice,text:vote.text})}const max=Math.max(1,total),status=state.open?"Voting Open":state.reveal?"Results Revealed":"Paused";document.getElementById("main").innerHTML=`<span class="status ${state.open?"open":""}">${status}</span><div class="q-zh">${esc(question.text)}</div>`+(state.reveal?CFG.options.map((option,index)=>`<div class="row"><div class="lab">${esc(option.label)}</div><div class="track"><div class="fill" style="width:${counts[option.id]/max*100}%;background:${cols[index]}"></div></div><div class="num">${counts[option.id]}<small>votes</small></div></div>`).join("")+`<p class="mut">Total voters: <b>${total}</b></p>`:`<div style="font-size:60px;font-weight:800;margin:10px 0">${total}<span style="font-size:20px;font-weight:400;color:var(--mut)"> votes received</span></div><p class="mut">Reveal results to show the chart to the audience.</p>`);let detail="";if(state.reveal){detail=`<div class="sub">Reason Summary</div>`+CFG.options.map(option=>{const entries=Object.entries(reasons[option.id]);return entries.length?`<p><b>${esc(option.label)}</b> `+entries.map(([reason,count])=>`<span class="tag">${esc(reason)} × ${count}</span>`).join("")+"</p>":""}).join("")+`<div class="sub">Audience Comments</div>`+(comments.length?comments.slice(-60).map(comment=>`<div class="txt"><b>${esc(comment.choice)}</b>${esc(comment.text)}</div>`).join(""):`<p class="mut">No comments yet.</p>`)}else detail=`<p class="mut">Reason breakdown and comments appear when results are revealed.</p>`;document.getElementById("detail").innerHTML=detail;document.getElementById("ctl").innerHTML=`<div class="sub">1. Select Question</div><div class="ctl-grid">`+CFG.questions.map(item=>`<button class="alt ${item.id===state.current?"cur":""}" onclick="act('select','${item.id}')">${esc(item.short)}<small>${esc(item.text)}</small></button>`).join("")+`</div><div class="sub" style="margin-top:16px">2. Host Controls</div><div class="ctl-grid"><button onclick="act('open')" ${state.open?"disabled":""}>Open Voting</button><button style="background:#2f6fed" onclick="act('reveal')">Reveal Results</button><button class="alt" onclick="act('close')">Close Voting</button><button class="alt" onclick="act('hide')">Hide Results</button><button class="alt danger" style="grid-column:span 2" onclick="if(confirm('Reset votes for this question?'))act('reset')">Reset Current Question</button></div>`}render();
</script></body></html>
