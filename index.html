<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Poll · Audience</title>
<style>
:root{--bg:#f6f7fb;--ink:#1c2233;--mut:#6b7385;--ok:#1f9d63;--err:#e11d48;--c0:#2f6fed;--c1:#f08a24;--c2:#8a93a6;--border:#dfe3ee}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:580px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(28,34,51,.08);border:1px solid var(--border)}
.top-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid #f0f2f8}
.status{display:inline-block;font-size:13px;padding:4px 12px;border-radius:99px;background:#e6e9f3;color:var(--mut);font-weight:700}
.status.open{background:#dff5ea;color:var(--ok)}
.right-tools{display:flex;align-items:center;gap:6px}
.conn-badge{font-size:12px;display:inline-flex;align-items:center;gap:5px;font-weight:600;padding:3px 9px;border-radius:99px}
.conn-badge.ok{color:var(--ok);background:#dff5ea}
.conn-badge.wait{color:#b45309;background:#fef3c7}
.conn-badge.err{color:var(--err);background:#fee2e2}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}
.mini-btn{font-family:inherit;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer;font-weight:600}
.mini-btn:active{background:#eef1fb}
.q-zh{font-size:23px;font-weight:700;line-height:1.35;margin:16px 0 4px}
.q-en{font-size:15px;color:var(--mut);line-height:1.4;margin:0 0 18px;font-weight:500}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:20px;padding:15px 18px;margin:10px 0;border:2px solid var(--border);border-radius:14px;background:#fff;font-family:inherit;text-align:left;cursor:pointer;transition:all .15s}
.opt:hover{border-color:#b8c0d4}
.opt.sel{border-color:var(--c0);background:#eef3fe;font-weight:700;color:var(--c0)}
.opt-en{font-size:15px;font-weight:500;opacity:.85}
.sub{font-size:15px;font-weight:700;margin:20px 0 8px;color:var(--ink)}
.sub span{font-weight:400;color:var(--mut);font-size:13px;display:block}
.chip{display:inline-block;font-size:14px;padding:7px 13px;margin:4px 6px 4px 0;border-radius:99px;border:2px solid var(--border);background:#fff;font-family:inherit;cursor:pointer;line-height:1.3;text-align:left}
.chip.sel{border-color:var(--ink);background:#eef1fb;font-weight:700}
.chip small{display:block;font-size:11px;color:var(--mut);font-weight:400}
textarea{width:100%;font-size:15px;padding:12px;border-radius:12px;border:2px solid var(--border);font-family:inherit;margin-top:10px;resize:vertical}
.go{width:100%;font-size:18px;font-weight:700;padding:15px;margin-top:16px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-family:inherit;cursor:pointer}
.go:disabled{opacity:.35;cursor:not-allowed}
.msg{color:var(--mut);margin:14px 0;font-size:15px;line-height:1.5}
.done{color:var(--ok);font-weight:700}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.lab{width:92px;font-weight:800;font-size:16px;line-height:1.2}
.lab small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.track{flex:1;background:#eceff6;border-radius:8px;height:36px;overflow:hidden}
.fill{height:100%;transition:width .5s ease}
.num{width:76px;text-align:right;color:var(--mut);font-weight:600;font-size:14px}
.room-box input{width:100%;font-size:20px;padding:12px;border:2px solid var(--border);border-radius:12px;margin:10px 0;text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app"><p class="msg">Loading live sync module…</p></div>
  <div class="bottom-bar" id="b-bar" style="display:none">
    <span>Room: <b id="room-lbl"></b></span>
    <div style="display:flex;gap:8px">
      <button class="mini-btn" onclick="resetMySession()">↻ Restart</button>
      <button class="mini-btn" onclick="changeRoom()">🚪 Change Room</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const CFG = {
  options: [
    { id: "A", zh: "A", en: "Model A" },
    { id: "B", zh: "B", en: "Model B" },
    { id: "Tie", zh: "Tie", en: "Tie" }
  ],
  reasons: [
    { id: "More comprehensive", zh: "More comprehensive", en: "More comprehensive" },
    { id: "More concise", zh: "More concise", en: "More concise" },
    { id: "Follows instructions better", zh: "Follows instructions better", en: "Follows instructions better" },
    { id: "Clearer formatting", zh: "Clearer formatting", en: "Clearer formatting" },
    { id: "More accurate info", zh: "More accurate info", en: "More accurate info" },
    { id: "More natural tone", zh: "More natural tone", en: "More natural tone" },
    { id: "About the same", zh: "About the same", en: "About the same" }
  ],
  questions: [
    { id: "r1", zh: "Round 1: Which response is better, A or B?", en: "Round 1: Which response is better, A or B?" },
    { id: "r2", zh: "Round 2: After seeing the reason clusters, has your judgment changed?", en: "Round 2: After seeing the reason clusters, has your judgment changed?" },
    { id: "r3", zh: "Round 3: After N-gram / function filtering, which model is better?", en: "Round 3: After N-gram / function filtering, which model is better?" },
    { id: "pred", zh: "Prediction: Which one will the LLM judge choose?", en: "Prediction: Which one will the LLM judge choose?" }
  ]
};

const params = new URLSearchParams(location.search);
let room = (params.get("room") || "").trim().toUpperCase();

let cid = localStorage.getItem("voter_cid_v2");
if (!cid) {
  cid = "u_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  localStorage.setItem("voter_cid_v2", cid);
}

const app = document.getElementById("app");
const cols = ["var(--c0)", "var(--c1)", "var(--c2)"];
const esc = s => String(s || "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

if (!room) {
  app.innerHTML = `
    <div class="room-box">
      <div class="q-zh" style="margin-top:0">Enter Session Room Code</div>
      <div class="q-en">Enter Session Room Code</div>
      <p class="msg">Scan the QR code on the host screen or manually enter the room code shown in the top right.<br>Please enter the room code to continue.</p>
      <input id="r-in" placeholder="e.g. AI2026" maxlength="20">
      <button class="go" onclick="joinRoom()">Join Poll</button>
    </div>`;
} else {
  document.getElementById("b-bar").style.display = "flex";
  document.getElementById("room-lbl").textContent = room;
  initVote(room);
}

function joinRoom() {
  const val = document.getElementById("r-in").value.trim().toUpperCase();
  if (!val) return alert("Please enter a room code");
  location.href = location.pathname + "?room=" + encodeURIComponent(val);
}

function changeRoom() {
  location.href = location.pathname;
}

function resetMySession() {
  if (!confirm("Clear local cache and restart this page?")) return;
  localStorage.removeItem("voter_cid_v2");
  localStorage.removeItem("voter_votes_" + room);
  location.reload();
}

function initVote(roomId) {
  const TOPIC_STATE = `livevote2026/${roomId}/state`;
  const TOPIC_VOTE  = `livevote2026/${roomId}/vote`;
  const TOPIC_PING  = `livevote2026/${roomId}/ping`;

  let state = { current: "r1", open: false, reveal: false, session: 0 };
  let myVotes = {};
  let allVotes = { r1: {}, r2: {}, r3: {}, pred: {} };
  let connStatus = "wait", connLabel = "Connecting…";
  let choice = null, reason = null, text = "", draftQ = null, lastSession = 0;

  try {
    myVotes = JSON.parse(localStorage.getItem("voter_votes_" + roomId) || "{}");
  } catch (e) {}

  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
    clientId: "voter_" + cid + "_" + Math.random().toString(36).slice(2, 6),
    keepalive: 20,
    reconnectPeriod: 2000
  });

  client.on("connect", () => {
    connStatus = "ok"; connLabel = "Live";
    client.subscribe([TOPIC_STATE, TOPIC_VOTE], { qos: 1 });
    client.publish(TOPIC_PING, JSON.stringify({ cid, ts: Date.now() }), { qos: 0 });
    render();
  });

  client.on("reconnect", () => { connStatus = "wait"; connLabel = "Reconnecting…"; render(); });
  client.on("offline", () => { connStatus = "err"; connLabel = "Offline"; render(); });
  client.on("error", () => { connStatus = "err"; connLabel = "Connection Error"; render(); });

  client.on("message", (topic, payload) => {
    try {
      const data = JSON.parse(payload.toString());
      if (topic === TOPIC_STATE && data && data.current) {
        if (data.session && lastSession && data.session !== lastSession) {
          myVotes = {};
          allVotes = { r1: {}, r2: {}, r3: {}, pred: {} };
          localStorage.removeItem("voter_votes_" + roomId);
          draftQ = null;
        }
        lastSession = data.session || 0;
        state = {
          current: data.current,
          open: !!data.open,
          reveal: !!data.reveal,
          session: data.session || 0
        };
        if (draftQ !== state.current) {
          draftQ = state.current;
          const mine = myVotes[state.current] || null;
          choice = mine ? mine.choice : null;
          reason = mine ? mine.reason : null;
          text = mine ? mine.text : "";
        }
        render();
      } else if (topic === TOPIC_VOTE && data && data.qid && data.cid) {
        if (state.session && data.session && data.session !== state.session) return;
        allVotes[data.qid] = allVotes[data.qid] || {};
        allVotes[data.qid][data.cid] = data;
        if (state.reveal && state.current === data.qid) render();
      }
    } catch (e) {}
  });

  window.forcePing = () => {
    connStatus = "wait"; connLabel = "Syncing…"; render();
    if (client && client.connected) {
      client.publish(TOPIC_PING, JSON.stringify({ cid, ts: Date.now() }), { qos: 1 });
      setTimeout(() => { connStatus = "ok"; connLabel = "Live"; render(); }, 600);
    } else {
      location.reload();
    }
  };

  window.pick = o => { choice = o; render(); };
  window.pickR = btn => { const r = btn.dataset.r; reason = (reason === r) ? null : r; render(); };
  window.send = () => {
    if (!state.open) return alert("Voting is closed or not opened yet");
    const t = document.getElementById("t");
    if (t) text = t.value;
    const payload = {
      qid: state.current,
      cid,
      choice,
      reason: reason || "",
      text: text.trim(),
      session: state.session,
      ts: Date.now()
    };
    myVotes[state.current] = payload;
    allVotes[state.current] = allVotes[state.current] || {};
    allVotes[state.current][cid] = payload;
    localStorage.setItem("voter_votes_" + roomId, JSON.stringify(myVotes));

    if (client && client.connected) {
      client.publish(TOPIC_VOTE, JSON.stringify(payload), { qos: 1 });
    } else {
      alert("Network is offline. Please refresh and try again.");
    }
    render();
  };

  function render() {
    const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
    const mine = myVotes[state.current] || null;
    if (typing && state.open && !mine && !state.reveal) return;

    const q = CFG.questions.find(item => item.id === state.current) || CFG.questions[0];
    const stText = state.open
      ? "Voting Open"
      : state.reveal
        ? "Results Revealed"
        : "Waiting for Host";

    let h = `<div class="top-meta">
      <span class="status ${state.open ? "open" : ""}">${stText}</span>
      <div class="right-tools">
        <span class="conn-badge ${connStatus}"><span class="dot"></span>${connLabel}</span>
        <button class="mini-btn" onclick="forcePing()" title="Refresh sync">↻ Refresh</button>
      </div>
    </div>`;
    h += `<div class="q-zh">${esc(q.zh)}</div><div class="q-en">${esc(q.en)}</div>`;

    if (state.open) {
      h += CFG.options.map(o => `
        <button class="opt ${choice === o.id ? "sel" : ""}" onclick="pick('${o.id}')">
          <span>${esc(o.zh)}</span>
          <span class="opt-en">${esc(o.en)}</span>
        </button>`).join("");
      if (choice) {
        h += `<div class="sub">Why?<span>Select a reason or write your own</span></div>`;
        h += CFG.reasons.map(r => `
          <button class="chip ${reason === r.id ? "sel" : ""}" onclick="pickR(this)" data-r="${esc(r.id)}">
            ${esc(r.zh)}<small>${esc(r.en)}</small>
          </button>`).join("");
        h += `<textarea id="t" rows="2" maxlength="200" placeholder="Other reason (optional)" oninput="text=this.value">${esc(text)}</textarea>`;
      }
      h += `<button class="go" ${choice ? "" : "disabled"} onclick="send()">${mine ? "Update Vote" : "Submit Vote"}</button>`;
      if (mine) h += `<p class="msg done">✓ Vote submitted. You can update it before voting closes.<br><small style="font-weight:400">Your vote is synced in real time.</small></p>`;
    } else if (state.reveal) {
      const v = allVotes[state.current] || {};
      const counts = {};
      CFG.options.forEach(o => counts[o.id] = 0);
      let total = 0;
      for (const id in v) {
        if (v[id] && v[id].choice) {
          total++;
          counts[v[id].choice] = (counts[v[id].choice] || 0) + 1;
        }
      }
      const max = Math.max(1, total);
      h += CFG.options.map((o, i) => `
        <div class="row">
          <div class="lab">${esc(o.zh)}<small>${esc(o.en)}</small></div>
          <div class="track"><div class="fill" style="width:${counts[o.id]/max*100}%;background:${cols[i%3]}"></div></div>
          <div class="num">${counts[o.id]} votes<br><small>votes</small></div>
        </div>`).join("");
      const myOpt = mine ? CFG.options.find(x => x.id === mine.choice) : null;
      h += `<p class="msg">Total votes: ${total}${myOpt ? `<br>Your choice: <b>${esc(myOpt.zh)} (${esc(myOpt.en)})</b>` : ""}</p>`;
    } else {
      const myOpt = mine ? CFG.options.find(x => x.id === mine.choice) : null;
      h += myOpt
        ? `<p class="msg done">✓ Your vote is recorded: ${esc(myOpt.zh)} (${esc(myOpt.en)})<br><small style="font-weight:400">Waiting for the host to reveal results…</small></p>`
        : `<p class="msg">Connected! The voting options will appear automatically when the host opens the poll.<br><small>Waiting for the host to begin.</small></p>`;
    }
    app.innerHTML = h;
  }

  render();
}
</script>
</body>
</html>
