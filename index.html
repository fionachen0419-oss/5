<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Poll · Audience</title>
<style>
:root{--bg:#f6f7fb;--ink:#1c2233;--mut:#6b7385;--ok:#1f9d63;--err:#e11d48;--c0:#2f6fed;--c1:#f08a24;--c2:#8a93a6;--border:#dfe3ee}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}.wrap{max-width:580px;margin:0 auto;padding:16px 16px 60px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 16px rgba(28,34,51,.08);border:1px solid var(--border)}.top-meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding-bottom:12px;border-bottom:1px solid #f0f2f8}.status{display:inline-block;font-size:13px;padding:4px 12px;border-radius:99px;background:#e6e9f3;color:var(--mut);font-weight:700}.status.open{background:#dff5ea;color:var(--ok)}.right-tools{display:flex;align-items:center;gap:6px}.conn-badge{font-size:12px;display:inline-flex;align-items:center;gap:5px;font-weight:600;padding:3px 9px;border-radius:99px}.conn-badge.ok{color:var(--ok);background:#dff5ea}.conn-badge.wait{color:#b45309;background:#fef3c7}.conn-badge.err{color:var(--err);background:#fee2e2}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.5s infinite}@keyframes pulse{0%{opacity:1}50%{opacity:.3}100%{opacity:1}}.mini-btn{font-family:inherit;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--ink);cursor:pointer;font-weight:600}.q-zh{font-size:23px;font-weight:700;line-height:1.35;margin:16px 0 18px}.opt{width:100%;font-size:20px;padding:15px 18px;margin:10px 0;border:2px solid var(--border);border-radius:14px;background:#fff;font-family:inherit;text-align:left;cursor:pointer}.opt.sel{border-color:var(--c0);background:#eef3fe;font-weight:700;color:var(--c0)}.sub{font-size:15px;font-weight:700;margin:20px 0 8px}.sub span{font-weight:400;color:var(--mut);font-size:13px;display:block}.chip{display:inline-block;font-size:14px;padding:7px 13px;margin:4px 6px 4px 0;border-radius:99px;border:2px solid var(--border);background:#fff;font-family:inherit;cursor:pointer}.chip.sel{border-color:var(--ink);background:#eef1fb;font-weight:700}textarea{width:100%;font-size:15px;padding:12px;border-radius:12px;border:2px solid var(--border);font-family:inherit;margin-top:10px;resize:vertical}.go{width:100%;font-size:18px;font-weight:700;padding:15px;margin-top:16px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-family:inherit;cursor:pointer}.go:disabled{opacity:.35;cursor:not-allowed}.msg{color:var(--mut);margin:14px 0;font-size:15px;line-height:1.5}.done{color:var(--ok);font-weight:700}.row{display:flex;align-items:center;gap:10px;margin:12px 0}.lab{width:92px;font-weight:800;font-size:16px}.track{flex:1;background:#eceff6;border-radius:8px;height:36px;overflow:hidden}.fill{height:100%;transition:width .5s ease}.num{width:76px;text-align:right;color:var(--mut);font-weight:600;font-size:14px}.room-box input{width:100%;font-size:20px;padding:12px;border:2px solid var(--border);border-radius:12px;margin:10px 0;text-align:center;font-weight:700;letter-spacing:2px;text-transform:uppercase}.bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 4px;font-size:12px;color:var(--mut)}
</style></head><body><div class="wrap"><div class="card" id="app"><p class="msg">Loading live poll…</p></div><div class="bottom-bar" id="b-bar" style="display:none"><span>Room: <b id="room-lbl"></b></span><div style="display:flex;gap:8px"><button class="mini-btn" onclick="resetMySession()">↻ Reset Page</button><button class="mini-btn" onclick="changeRoom()">🚪 Change Room</button></div></div></div>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script><script>
const CFG={options:[{id:"A",label:"Model A"},{id:"B",label:"Model B"},{id:"Tie",label:"Tie"}],reasons:["More comprehensive","More concise","Follows instructions better","Clearer formatting","More accurate info","More natural tone","About the same"],questions:[{id:"r1",text:"Round 1: Word Limit"},{id:"r2",text:"Round 2: Customer service empathy"},{id:"r3",text:"Round 3: Questions without clear rules"},{id:"ex1",text:"EX1: Planning a One-Day Trip to Tainan"},{id:"ex2",text:"EX2: Write a four-line poem"},{id:"pred",text:"Prediction: Which one will the LLM judge choose?"}]};
const ROOM_KEY="voter_room_v2",params=new URLSearchParams(location.search);let room=(params.get("room")||localStorage.getItem(ROOM_KEY)||"").trim().toUpperCase();if(room)localStorage.setItem(ROOM_KEY,room);let cid=localStorage.getItem("voter_cid_v2");if(!cid){cid="u_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem("voter_cid_v2",cid)}const app=document.getElementById("app"),cols=["var(--c0)","var(--c1)","var(--c2)"],esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if(!room){app.innerHTML=`<div class="room-box"><div class="q-zh">Enter Session Room Code</div><p class="msg">Scan the host's QR code or enter the room code provided by the host.</p><input id="r-in" placeholder="e.g. AI2026" maxlength="20"><button class="go" onclick="joinRoom()">Join Poll</button></div>`}else{document.getElementById("b-bar").style.display="flex";document.getElementById("room-lbl").textContent=room;initVote(room)}
function joinRoom(){const val=document.getElementById("r-in").value.trim().toUpperCase();if(!val)return alert("Please enter a room code");localStorage.setItem(ROOM_KEY,val);location.href=location.pathname+"?room="+encodeURIComponent(val)}function changeRoom(){localStorage.removeItem(ROOM_KEY);location.href=location.pathname}function resetMySession(){if(!confirm("Clear your saved vote on this device and reconnect?"))return;localStorage.removeItem("voter_cid_v2");localStorage.removeItem("voter_votes_"+room);location.reload()}
function initVote(roomId){const TS=`livevote2026/${roomId}/state`,TV=`livevote2026/${roomId}/vote`,TP=`livevote2026/${roomId}/ping`;let state={current:"r1",open:false,reveal:false,session:0},myVotes={},allVotes={r1:{},r2:{},r3:{},ex1:{},ex2:{},pred:{}},connStatus="wait",connLabel="Connecting…",choice=null,reason=null,text="",draftQ=null,lastSession=0;try{myVotes=JSON.parse(localStorage.getItem("voter_votes_"+roomId)||"{}")}catch(e){}const client=mqtt.connect("wss://broker.hivemq.com:8884/mqtt",{clientId:"voter_"+cid+"_"+Math.random().toString(36).slice(2,6),keepalive:20,reconnectPeriod:2000});
client.on("connect",()=>{connStatus="ok";connLabel="Live";client.subscribe([TS,TV],{qos:1});client.publish(TP,JSON.stringify({cid,ts:Date.now()}),{qos:0});render()});client.on("reconnect",()=>{connStatus="wait";connLabel="Reconnecting…";render()});client.on("offline",()=>{connStatus="err";connLabel="Offline — retrying";render()});client.on("error",()=>{connStatus="err";connLabel="Connection error — retrying";render()});client.on("message",(topic,payload)=>{try{const d=JSON.parse(payload.toString());if(topic===TS&&d&&d.current){if(d.session&&lastSession&&d.session!==lastSession){myVotes={};allVotes={r1:{},r2:{},r3:{},ex1:{},ex2:{},pred:{}};localStorage.removeItem("voter_votes_"+roomId);draftQ=null}lastSession=d.session||0;const next={current:d.current,open:!!d.open,reveal:!!d.reveal,session:d.session||0},changed=next.current!==state.current||next.open!==state.open||next.reveal!==state.reveal||next.session!==state.session;state=next;if(draftQ!==state.current){draftQ=state.current;const mine=myVotes[state.current]||null;choice=mine?mine.choice:null;reason=mine?mine.reason:null;text=mine?mine.text:""}if(changed)render()}else if(topic===TV&&d&&d.qid&&d.cid){if(state.session&&d.session&&d.session!==state.session)return;allVotes[d.qid]=allVotes[d.qid]||{};allVotes[d.qid][d.cid]=d;if(state.reveal&&state.current===d.qid)render()}}catch(e){}});
window.forcePing=()=>{if(client.connected){connStatus="wait";connLabel="Syncing…";render();client.publish(TP,JSON.stringify({cid,ts:Date.now()}),{qos:1});setTimeout(()=>{if(client.connected){connStatus="ok";connLabel="Live";render()}},800)}else{connStatus="err";connLabel="Offline — reconnecting automatically";render()}};window.pick=o=>{choice=o;render()};window.pickR=b=>{const r=b.dataset.r;reason=reason===r?null:r;render()};window.send=()=>{if(!state.open)return alert("Voting is not open or has closed");const t=document.getElementById("t");if(t)text=t.value;const p={qid:state.current,cid,choice,reason:reason||"",text:text.trim(),session:state.session,ts:Date.now()};myVotes[state.current]=p;allVotes[state.current]=allVotes[state.current]||{};allVotes[state.current][cid]=p;localStorage.setItem("voter_votes_"+roomId,JSON.stringify(myVotes));if(client.connected)client.publish(TV,JSON.stringify(p),{qos:1});else alert("You are offline. Your vote is saved on this device but has not synced yet. Please reconnect and submit again.");render()};
function render(){const typing=document.activeElement&&document.activeElement.tagName==="TEXTAREA",mine=myVotes[state.current]||null;if(typing&&state.open&&!mine&&!state.reveal)return;const q=CFG.questions.find(x=>x.id===state.current)||CFG.questions[0],status=state.open?"Voting Open":state.reveal?"Results Revealed":"Waiting for Host";let h=`<div class="top-meta"><span class="status ${state.open?"open":""}">${status}</span><div class="right-tools"><span class="conn-badge ${connStatus}"><span class="dot"></span>${connLabel}</span><button class="mini-btn" onclick="forcePing()">↻ Sync</button></div></div><div class="q-zh">${esc(q.text)}</div>`;if(state.open){h+=CFG.options.map(o=>`<button class="opt ${choice===o.id?"sel":""}" onclick="pick('${o.id}')">${esc(o.label)}</button>`).join("");if(choice){h+=`<div class="sub">Why?<span>Select a reason or add an optional comment</span></div>`+CFG.reasons.map(r=>`<button class="chip ${reason===r?"sel":""}" onclick="pickR(this)" data-r="${esc(r)}">${esc(r)}</button>`).join("")+`<textarea id="t" rows="2" maxlength="200" placeholder="Other comment (optional)" oninput="text=this.value">${esc(text)}</textarea>`}h+=`<button class="go" ${choice?"":"disabled"} onclick="send()">${mine?"Update Vote":"Submit Vote"}</button>`;if(mine)h+=`<p class="msg done">✓ Vote submitted. You can update it before voting closes.</p>`}else if(state.reveal){const v=allVotes[state.current]||{},counts={};CFG.options.forEach(o=>counts[o.id]=0);let total=0;for(const id in v)if(v[id]&&v[id].choice){total++;counts[v[id].choice]=(counts[v[id].choice]||0)+1}const max=Math.max(1,total);h+=CFG.options.map((o,i)=>`<div class="row"><div class="lab">${esc(o.label)}</div><div class="track"><div class="fill" style="width:${counts[o.id]/max*100}%;background:${cols[i]}"></div></div><div class="num">${counts[o.id]} votes</div></div>`).join("")+`<p class="msg">Total votes: ${total}${mine?`<br>Your choice: <b>${esc(mine.choice)}</b>`:""}</p>`}else h+=mine?`<p class="msg done">✓ Your vote is recorded. Waiting for the host to reveal results…</p>`:`<p class="msg">Connected! Voting options will appear when the host opens the poll.</p>`;app.innerHTML=h}render()}
</script></body></html>
